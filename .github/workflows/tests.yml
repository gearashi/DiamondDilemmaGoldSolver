name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm tests use synthetic puzzle data
        run: python -c "from pathlib import Path; assert not Path('data/tiles.json').exists()"

      - name: Run CPU-only tests
        run: >-
          python -B -m unittest -v
          test_geometry
          test_exact_frontier
          test_systematic_jobs
          test_systematic_runner
          test_dashboard_control
          test_stop
          test_position_cache
          test_prepare_data
          test_atomic_io
          test_replica_resize
          test_linux_setup
          test_windows_setup
          test_platform
          test_webgpu

  linux-install:
    name: Linux CUDA package installation (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-common.txt

      - name: Install with the Linux setup script
        run: bash Setup.sh --skip-data --backend cuda --python python3.12

      - name: Import installed packages without initializing CUDA
        run: >-
          venv/bin/python -c
          "import cupy; import numpy; from PIL import Image;
          from pathlib import Path; print('CuPy', cupy.__version__);
          assert not Path('data/tiles.json').exists()"

  webgpu-install:
    name: Native WebGPU package installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # GitHub standard runner labels: Intel and native Apple Silicon.
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        os: [windows-latest, ubuntu-24.04, macos-15-intel, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-webgpu.txt
            requirements-common.txt

      - name: Install Windows WebGPU packages
        if: runner.os == 'Windows'
        run: .\Setup.ps1 -SkipData -Backend webgpu

      - name: Install Linux or macOS WebGPU packages
        if: runner.os != 'Windows'
        run: bash Setup.sh --skip-data --backend webgpu --python python3.12

      - name: Import native packages without requesting a GPU
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          executable = 'venv/Scripts/python.exe' if os.name == 'nt' else 'venv/bin/python'
          code = "import platform,wgpu,numpy,ortools; from PIL import Image; from wgpu.backends import wgpu_native; from pathlib import Path; print(platform.system(), platform.machine(), wgpu.__version__); assert not Path('data/tiles.json').exists()"
          subprocess.check_call([executable, '-c', code])
          PY

  shader-validation:
    name: WGSL finite checks (software Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-webgpu.txt
            requirements-common.txt

      - name: Install Mesa software Vulkan and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1
          python -m pip install -r requirements-webgpu.txt

      - name: Run finite shader tests on lavapipe
        env:
          DIAMOND_TEST_WEBGPU: '1'
          DIAMOND_TEST_SOFTWARE_GPU: '1'
          WGPU_BACKEND_TYPE: Vulkan
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          export VK_ICD_FILENAMES="$icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/diamond-vulkan"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          python -B -m unittest -v test_webgpu

  source-distribution:
    name: Source package (${{ matrix.target }})
    needs: [cpu, linux-install, webgpu-install, shader-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - target: windows-x64
            format: zip
          - target: linux-x64
            format: tar.gz
          - target: macos-x64
            format: tar.gz
          - target: macos-arm64
            format: tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive tracked source and setup scripts
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          files = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', '-z']).decode().split('\0')
          forbidden = {'data', 'runtime', 'venv', '.venv', '.venv-test', '.venv-webgpu', '.codex', 'audit', 'dist', 'stochastic-runtime', 'dfs-runtime'}
          for name in filter(None, files):
              path = PurePosixPath(name)
              assert not any(part in forbidden for part in path.parts), name
              assert path.suffix.lower() not in {'.gif', '.png', '.jpg', '.jpeg', '.npz', '.sqlite', '.sqlite3'}, name
          folder = Path('dist')
          folder.mkdir()
          filename = 'DiamondDilemmaGoldSolver-' + os.environ['PACKAGE_TARGET'] + '-source.' + os.environ['ARCHIVE_FORMAT']
          archive = folder / filename
          subprocess.check_call(['git', 'archive', '--format=' + os.environ['ARCHIVE_FORMAT'], '--prefix=DiamondDilemmaGoldSolver/', '--output=' + str(archive), 'HEAD'])
          (folder / 'SHA256SUMS.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + filename + '\n')
          (folder / 'PACKAGE-NOTES.txt').write_text('Portable source distribution, not a standalone executable. Install native Python 3.12 and run Setup.cmd (Windows) or bash Setup.sh (Linux/macOS). Dependencies and puzzle data are prepared locally. These target labels identify setup platforms; source contents are shared.\n')
          PY

      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DiamondDilemmaGoldSolver-${{ matrix.target }}-source
          path: dist/*
          if-no-files-found: error
          compression-level: 0
