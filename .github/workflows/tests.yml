name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel, macos-15]
        python: ['3.12', '3.15']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-py315.txt
            requirements-dev.txt
            requirements-common.txt

      - name: Install full Python 3.12 dependencies
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-dev.txt

      - name: Install Python 3.15 DFS and WebGPU profile
        if: matrix.python == '3.15'
        run: >-
          python -m pip install --only-binary=:all: -r requirements-py315.txt

      - name: Build optional native CPU propagation
        run: python build_native.py

      - name: Confirm tests use synthetic puzzle data
        run: python -c "from pathlib import Path; assert not Path('data/tiles.json').exists()"

      - name: Run CPU-only tests
        env:
          DIAMOND_REQUIRE_NATIVE: '1'
        run: >-
          python -B -m unittest -v
          test_geometry
          test_exact_frontier
          test_systematic_jobs
          test_systematic_runner
          test_dashboard_control
          test_stop
          test_position_cache
          test_prepare_data
          test_atomic_io
          test_replica_resize
          test_linux_setup
          test_windows_setup
          test_platform
          test_runtime_capabilities
          test_webgpu
          test_webgpu_checkpoint
          test_constraint_dfs
          test_constraint_branching
          test_constraint_gold_oracle
          test_constraint_lcg
          test_constraint_native_search
          test_constraint_engines
          test_constraint_pruning
          test_constraint_projection
          test_constraint_parity
          test_constraint_connectivity
          test_constraint_advanced
          test_constraint_separator
          test_constraint_learning
          test_constraint_scheduling
          test_constraint_knowledge
          test_constraint_parallel
          test_constraint_native
          test_constraint_native_blocks
          test_constraint_native_forests
          test_search_options
          test_search_problem
          test_constraint_symmetry
          test_smart_dfs
          test_constraint_lns
          test_constraint_models
          test_constraint_circuit
          test_constraint_residual
          test_constraint_regions
          test_constraint_sat_assist
          test_constraint_shared_conflicts
          test_constraint_ordering
          test_constraint_explanations
          test_constraint_reasons
          test_gpu_sampling
          test_constraint_search
          test_search_fixtures

  linux-install:
    name: Linux CUDA package installation (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-common.txt

      - name: Install with the Linux setup script
        run: bash Setup.sh --skip-data --backend cuda --python python3.12

      - name: Import installed packages without initializing CUDA
        run: >-
          venv/bin/python -c
          "import cupy; import numpy; from PIL import Image;
          from pathlib import Path; print('CuPy', cupy.__version__);
          assert not Path('data/tiles.json').exists()"

  webgpu-install:
    name: Native WebGPU package installation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # GitHub standard runner labels: Intel and native Apple Silicon.
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        os: [windows-latest, ubuntu-24.04, macos-15-intel, macos-15]
        python: ['3.12', '3.15']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-py315.txt
            requirements-webgpu.txt
            requirements-common.txt

      - name: Install Windows WebGPU packages
        if: runner.os == 'Windows'
        run: .\Setup.ps1 -SkipData -Backend webgpu -Python (Get-Command python).Source

      - name: Install Linux or macOS WebGPU packages
        if: runner.os != 'Windows'
        run: bash Setup.sh --skip-data --backend webgpu --python python${{ matrix.python }}

      - name: Import native packages without requesting a GPU
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          executable = 'venv/Scripts/python.exe' if os.name == 'nt' else 'venv/bin/python'
          code = "import platform,wgpu,numpy; from PIL import Image; from wgpu.backends import wgpu_native; from pathlib import Path; print(platform.system(), platform.machine(), wgpu.__version__); assert not Path('data/tiles.json').exists()"
          subprocess.check_call([executable, '-c', code])
          PY

  shader-validation:
    name: WGSL finite checks (software Vulkan, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-py315.txt
            requirements-webgpu.txt
            requirements-common.txt

      - name: Install Mesa software Vulkan and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1
          if [ "${{ matrix.python }}" = "3.15" ]; then
            python -m pip install --only-binary=:all: -r requirements-py315.txt
          else
            python -m pip install -r requirements-webgpu.txt
          fi

      - name: Run finite shader tests on lavapipe
        env:
          DIAMOND_TEST_WEBGPU: '1'
          DIAMOND_TEST_GPU_SAMPLING: '1'
          DIAMOND_SAMPLING_BACKEND: webgpu
          DIAMOND_TEST_SOFTWARE_GPU: '1'
          WGPU_BACKEND_TYPE: Vulkan
        run: |
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          export VK_ICD_FILENAMES="$icd"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/diamond-vulkan"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          python -B -m unittest -v test_webgpu test_gpu_sampling

  source-distribution:
    name: Source package (${{ matrix.target }})
    needs: [cpu, linux-install, webgpu-install, shader-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - target: windows-x64
            format: zip
          - target: linux-x64
            format: tar.gz
          - target: macos-x64
            format: tar.gz
          - target: macos-arm64
            format: tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive tracked source and setup scripts
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          files = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD', '-z']).decode().split('\0')
          forbidden = {'.native', 'data', 'runtime', 'venv', '.venv', '.venv-test', '.venv-webgpu', '.venv-compare', '.codex', 'audit', 'dist', 'stochastic-runtime', 'dfs-runtime'}
          for name in filter(None, files):
              path = PurePosixPath(name)
              assert not any(part in forbidden for part in path.parts), name
              assert path.suffix.lower() not in {'.gif', '.png', '.jpg', '.jpeg', '.npz', '.sqlite', '.sqlite3', '.dll', '.exe', '.so', '.dylib', '.pyd', '.a', '.lib', '.o', '.obj'}, name
          folder = Path('dist')
          folder.mkdir()
          filename = 'DiamondDilemmaGoldSolver-' + os.environ['PACKAGE_TARGET'] + '-source.' + os.environ['ARCHIVE_FORMAT']
          archive = folder / filename
          subprocess.check_call(['git', 'archive', '--format=' + os.environ['ARCHIVE_FORMAT'], '--prefix=DiamondDilemmaGoldSolver/', '--output=' + str(archive), 'HEAD'])
          (folder / 'SHA256SUMS.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + filename + '\n')
          (folder / 'PACKAGE-NOTES.txt').write_text('Portable source distribution, not a standalone executable. Install native Python 3.12 for all engines, or standard Python 3.15 for DFS and WebGPU only, and run Setup.cmd (Windows) or bash Setup.sh (Linux/macOS). Dependencies and puzzle data are prepared locally. These target labels identify setup platforms; source contents are shared.\n')
          PY

      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DiamondDilemmaGoldSolver-${{ matrix.target }}-source
          path: dist/*
          if-no-files-found: error
          compression-level: 0
