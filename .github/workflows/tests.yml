name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Confirm tests use synthetic puzzle data
        run: python -c "from pathlib import Path; assert not Path('data/tiles.json').exists()"

      - name: Run CPU-only tests
        run: >-
          python -B -m unittest -v
          test_geometry
          test_exact_frontier
          test_systematic_jobs
          test_systematic_runner
          test_dashboard_control
          test_stop
          test_position_cache
          test_prepare_data
          test_atomic_io
          test_replica_resize
